<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>리코더 운지법 · 초록 음악 교실</title>
<style>
:root{--green:#237953;--dark:#173e30;--soft:#edf6ef;--line:#dce7df}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--dark);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #e4a83a;outline-offset:4px}header{height:100px;padding:22px 4%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:15px}.logo{background:var(--green);color:white;border-radius:17px;font-size:29px;padding:8px 17px}h1{font-size:28px;margin:0 0 4px;letter-spacing:-1px}.sub{font-size:13px;color:#708277}.badge{background:var(--soft);border-radius:20px;padding:8px 14px;font-size:13px}.outline{border:1px solid var(--line);border-radius:12px;background:white;color:var(--dark);padding:12px 18px}main{display:grid;grid-template-columns:180px minmax(300px,1fr) minmax(380px,1.12fr);min-height:calc(100vh - 155px);max-width:1600px;margin:auto}aside{padding:25px 18px;border-right:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:#789184;margin-bottom:15px}.notes{display:grid;gap:5px}.note{border:0;border-radius:10px;background:transparent;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;color:#4d6557;min-height:35px;text-align:left;font-size:18px;font-weight:700}.note small{font-weight:400;font-size:12px;opacity:.65}.note:hover{background:var(--soft)}.note.active{background:var(--green);color:white;box-shadow:0 4px 12px #23795325}.note.acc{background:#f4f7f4}.note.acc.active{background:var(--green)}.music{padding:38px 35px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.current{display:flex;align-items:center;gap:15px}.current h2{font-size:62px;letter-spacing:-3px;margin:12px 0}.pitch{color:#80958a;font-size:20px}.staff{width:100%;max-width:450px;height:205px;margin:12px 0 24px}.play{border:0;background:var(--green);color:#fff;border-radius:16px;padding:18px 40px;min-width:230px;font-size:21px;font-weight:700;box-shadow:0 7px 20px #23795320}.play.playing{background:#115739;transform:scale(.98)}.audio-settings{display:flex;align-items:center;gap:12px;font-size:13px;color:#778c7f;margin:22px 0 12px;flex-wrap:wrap;justify-content:center}input{accent-color:var(--green)}input[type=range]{width:95px}.autoplay{font-size:14px;display:flex;align-items:center;gap:7px;margin-bottom:25px}.tip{max-width:410px;border:1px solid var(--line);background:#fafcf9;border-radius:16px;padding:17px 21px;font-size:15px;line-height:1.8;text-align:left;min-height:90px}.tip strong{color:var(--green)}.diagram{margin:24px 24px 24px 0;background:#f7faf6;border:1px solid #e5ece3;border-radius:24px;display:flex;flex-direction:column;align-items:center;padding:20px 22px 14px;position:relative}.toolbar{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px}.seg{display:flex;border:1px solid var(--line);background:white;padding:4px;border-radius:12px}.seg button{border:0;background:transparent;padding:10px 16px;border-radius:8px;color:#698372;font-size:14px}.seg button[aria-pressed=true]{background:var(--green);color:white}.mirror{border:1px solid var(--line);background:white;border-radius:10px;padding:13px;color:var(--green);font-size:14px}.mirror[aria-pressed=true]{background:#dfefe2;border-color:#8ebc9b}.mirror:disabled{opacity:.4;cursor:default}.diagram svg{width:100%;max-width:470px;height:490px;flex:1;min-height:350px}.legend{display:flex;gap:20px;font-size:13px;color:#637b6c;align-items:center;margin:10px 0}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--green);vertical-align:-2px;margin-right:5px}.closed{background:var(--green)}.vent{background:linear-gradient(90deg,var(--green) 75%,white 75%)}.direction{font-size:12px;color:#7a9080;margin:9px 0 0}footer{border-top:1px solid var(--line);padding:16px 4%;display:flex;justify-content:space-between;color:#85958b;font-size:11px;gap:15px}footer a{color:inherit}.keyhint{font-size:12px;margin-top:18px;color:#93a096}.status{height:17px;font-size:12px;color:var(--green)}
@media(min-width:1700px){main{max-width:1900px}h1{font-size:36px}.note{font-size:23px;padding:12px}.diagram svg{height:650px}.current h2{font-size:80px}}
@media(max-width:1000px){main{grid-template-columns:130px 1fr 1fr}.music{padding:22px 18px}.diagram{margin-right:12px;padding:12px}.toolbar{flex-wrap:wrap}.seg button{padding:9px}.current h2{font-size:45px}.play{min-width:190px;padding:16px}.legend{gap:9px;font-size:11px}}
@media(max-width:720px){header{height:auto;padding:18px}.badge{display:none}h1{font-size:22px}.logo{font-size:22px}main{display:flex;flex-wrap:wrap}aside{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:16px}.notes{grid-template-columns:repeat(7,1fr);gap:5px}.note{font-size:14px;padding:9px 3px;display:block;text-align:center}.note small{display:none}.eyebrow{display:none}.music{width:100%;padding:20px}.current h2{font-size:40px}.staff{height:140px;margin:0}.audio-settings{margin:15px}.tip{width:100%}.diagram{width:calc(100% - 28px);margin:0 14px 20px}.diagram svg{height:480px;flex:auto}.keyhint{display:none}footer{flex-wrap:wrap}.autoplay{margin-bottom:15px}}
</style>
<header><div class="brand"><span class="logo" aria-hidden="true">♫</span><div><h1>리코더 운지법</h1><div class="sub">보고, 듣고, 함께 연주해요</div></div></div><div style="display:flex;align-items:center;gap:14px"><span class="badge">소프라노 · 저먼식 G</span><button class="outline" id="fullscreen">⛶ 전체 화면</button></div></header>
<main>
<aside><div class="eyebrow">연주할 음 선택</div><nav class="notes" aria-label="리코더 음 선택" id="notes"></nav></aside>
<section class="music" aria-label="악보와 소리"><div class="eyebrow">오늘도 즐거운 리코더 시간</div><div class="current"><h2 id="name">도</h2><span class="pitch" id="pitch">C</span></div><svg id="staff" class="staff" viewBox="0 0 440 200" role="img"></svg><button class="play" id="play">▷ 소리 듣기</button><div class="audio-settings"><span>음량</span><input aria-label="음량" id="volume" type="range" min="0" max="100" value="55"><span>길이</span><select id="duration" aria-label="재생 길이"><option value="1">1초</option><option value="2" selected>2초</option><option value="3">3초</option></select></div><label class="autoplay"><input id="auto" type="checkbox" checked> 음을 선택하면 소리 듣기</label><div class="tip" id="tip"></div><div class="keyhint">← → 음 이동 · 스페이스 소리 듣기</div><div class="status" id="status" role="status"></div></section>
<section class="diagram" aria-label="운지 그림"><div class="toolbar"><div class="seg" aria-label="표시 모드"><button id="holes" aria-pressed="true">● 구멍 보기</button><button id="hands" aria-pressed="false">☞ 손 보기</button></div><button id="mirror" class="mirror" aria-pressed="false" disabled>⇄ 거울 모드</button></div><svg id="recorder" viewBox="0 0 470 560" role="img"></svg><div class="legend"><span><i class="dot closed"></i>막기</span><span><i class="dot"></i>열기</span><span><i class="dot vent"></i>조금 열기</span></div><p class="direction" id="direction">앞면의 1–7번 구멍 · 0번은 뒷면 엄지 구멍</p></section>
</main><footer><span>왼손은 위에, 오른손은 아래에 · 마지막 두 구멍은 겹구멍이에요.</span><span><a href="https://www.yamaha.com/en/musical_instrument_guide/common/images/recorder/fingering_german.pdf" target="_blank" rel="noopener">운지 기준: YAMAHA 저먼식</a> · 소리: 합성 리코더 음색</span></footer>
<script>
// 0: thumb; 1–7: front holes. 0.75 vents thumb; 0.5 covers one of a double hole.
const notes=[
 ['도','C',72,0,[1,1,1,1,1,1,1,1]],['레','D',74,1,[1,1,1,1,1,1,1,0]],['미','E',76,2,[1,1,1,1,1,1,0,0]],['파','F',77,3,[1,1,1,1,1,0,0,0]],['솔','G',79,4,[1,1,1,1,0,0,0,0]],['라','A',81,5,[1,1,1,0,0,0,0,0]],['시','B',83,6,[1,1,0,0,0,0,0,0]],['높은 도','C′',84,7,[1,0,1,0,0,0,0,0]],['높은 레','D′',86,8,[0,0,1,0,0,0,0,0]],['높은 미','E′',88,9,[.75,1,1,1,1,1,0,0]],['높은 파','F′',89,10,[.75,1,1,1,1,0,0,0]],['높은 솔','G′',91,11,[.75,1,1,1,0,0,0,0]],['파♯','F♯',78,3,[1,1,1,1,0,1,1,1]],['시♭','B♭',82,6,[1,1,1,0,1,1,.5,0]]
];
let selected=0,handMode=false,mirrored=false,ctx,voice,playTimer,serial=0;
const $=id=>document.getElementById(id);
const circle=(x,y,r,fill,stroke='#277951')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
function renderStaff(n){const y=155-n[3]*10;let s='<g stroke="#b6c6bc" stroke-width="1.6">';
 for(let i=0;i<5;i++)s+=`<path d="M25 ${55+i*20}H420"/>`;s+='</g><text x="42" y="139" font-family="Segoe UI Symbol,serif" font-size="106" fill="#244d38">𝄞</text>';
 if(y>=155)s+=`<path d="M258 155H322" stroke="#476854" stroke-width="2"/>`;if(y<=35)s+=`<path d="M258 35H322" stroke="#476854" stroke-width="2"/>`;
 if(n[0].includes('♯')||n[0].includes('♭'))s+=`<text x="231" y="${y+12}" font-size="39" fill="#237953">${n[0].slice(-1)}</text>`;
 s+=`<ellipse cx="290" cy="${y}" rx="19" ry="12" fill="#237953"/><ellipse cx="290" cy="${y}" rx="7" ry="10" fill="white" transform="rotate(-24 290 ${y})"/>`;$('staff').innerHTML=s;$('staff').setAttribute('aria-label',n[0]+' 악보, 소프라노 리코더는 표기보다 한 옥타브 높게 소리납니다.');}
function renderRecorder(n){
 const f=n[4],ys=[192,230,270,310,358,398,443,487];
 let s=`<defs><linearGradient id="body"><stop stop-color="#dce4d5"/><stop offset=".35" stop-color="#fffff4"/><stop offset=".75" stop-color="#f4f5e6"/><stop offset="1" stop-color="#cdd8c6"/></linearGradient><linearGradient id="skin" x2=".8" y2="1"><stop stop-color="#f7d7b7"/><stop offset="1" stop-color="#dfad88"/></linearGradient><linearGradient id="vent"><stop offset=".75" stop-color="#237953"/><stop offset=".75" stop-color="white"/></linearGradient></defs>`;
 const flip=handMode&&mirrored;s+=`<g ${flip?'transform="translate(470 0) scale(-1 1)"':''}>`;
 if(handMode)s+=`<g fill="url(#skin)" stroke="#c49778" stroke-width="1.5"><path d="M80 335 Q79 295 97 246 Q109 221 141 226 L162 244 L169 315 Q153 348 130 367 L124 387 L78 378Z"/><path d="M383 520 L390 461 Q386 422 364 389 Q349 366 325 378 L301 409 L308 478 Q323 505 336 530Z"/></g>`;
 s+=`<g stroke="#a6b59e" stroke-width="2"><path d="M211 137 L213 48 Q213 24 235 24 Q257 24 257 48 L259 137Z" fill="url(#body)"/><path d="M224 78H246V96H224Z" fill="#82927b"/><path d="M225 79H245L241 88H228Z" fill="#e4ead9"/><rect x="207" y="133" width="56" height="27" rx="8" fill="url(#body)"/><path d="M214 160H256L253 433H217Z" fill="url(#body)"/><path d="M216 433H254L258 496H212Z" fill="url(#body)"/><rect x="212" y="429" width="46" height="10" rx="4" fill="url(#body)"/><rect x="209" y="495" width="52" height="11" rx="4" fill="url(#body)"/><path d="M220 506H250Q244 526 265 542Q237 554 205 542Q225 523 220 506Z" fill="url(#body)"/></g>`;
 for(let i=1;i<=7;i++){const v=f[i],y=ys[i];if(i<6)s+=circle(235,y,i===5?7:10,v?'#237953':'white');else{s+=circle(228,y,6,v?'#237953':'white')+circle(243,y+2,5,v===1?'#237953':'white');}}
 if(handMode){
 // Fingers join the palm; open fingers lift away from the instrument.
 for(let i=1;i<=7;i++){const left=i<=3,y=ys[i],closed=f[i]>0,start=left?124:348,end=closed?(f[i]===.5?228:235):(left?186:282),bend=left?-7:7;
 s+=`<path d="M${start} ${y+13} Q${(start+end)/2} ${y+bend} ${end} ${closed?y:y-16}" fill="none" stroke="#c49778" stroke-width="${i===7?20:24}" stroke-linecap="round"/><path d="M${start} ${y+11} Q${(start+end)/2} ${y+bend-2} ${end} ${closed?y-2:y-18}" fill="none" stroke="url(#skin)" stroke-width="${i===7?17:21}" stroke-linecap="round"/>`;
 s+=`<ellipse cx="${end}" cy="${closed?y-4:y-20}" rx="7" ry="5" fill="#fce5cc" stroke="#d2ae91" stroke-width=".8"/>`;
 }
 }
 s+='</g>';
 // Labels stay readable when the instrument and hands are mirrored.
 for(let i=1;i<=7;i++)s+=`<text x="${flip?194:276}" y="${ys[i]+5}" font-size="13" fill="#7d9281" text-anchor="middle">${i}</text>`;
 s+=`<path d="M${flip?213:257} 184L${flip?146:326} 174" stroke="#aec2af" stroke-dasharray="4 4" fill="none"/>`;
 const tx=flip?103:367;s+=`<rect x="${tx-43}" y="123" width="86" height="91" rx="17" fill="white" stroke="#dce7df"/><text x="${tx}" y="144" text-anchor="middle" font-size="11" fill="#637e6c">뒷면 · 엄지 0</text>${circle(tx,170,14,f[0]===.75?'url(#vent)':f[0]?'#237953':'white')}<text x="${tx}" y="202" text-anchor="middle" font-size="11" fill="#237953">${f[0]===.75?'조금 열기':f[0]?'막기':'열기'}</text>`;
 if(handMode)s+=`<text x="${flip?360:105}" y="215" text-anchor="middle" fill="#64836c" font-size="14">왼손</text><text x="${flip?115:360}" y="364" text-anchor="middle" fill="#64836c" font-size="14">오른손</text>`;
 $('recorder').innerHTML=s;$('recorder').setAttribute('aria-label',`${n[0]} 운지. 엄지 ${f[0]===.75?'조금 열기':f[0]?'막기':'열기'}. 앞면 ${f.slice(1).map((v,i)=>`${i+1}번 ${v===.5?'겹구멍 하나만 막기':v?'막기':'열기'}`).join(', ')}`);
 $('direction').textContent=handMode?(mirrored?'거울 모드 · 화면을 보며 같은 쪽 손으로 따라 해요':'실제 방향 · 연주자를 마주 보고 있는 모습'):'앞면의 1–7번 구멍 · 0번은 뒷면 엄지 구멍';
}
function render(){const n=notes[selected];document.querySelectorAll('.note').forEach((b,i)=>{b.classList.toggle('active',i===selected);b.setAttribute('aria-pressed',i===selected)});$('name').textContent=n[0];$('pitch').textContent=n[1];renderStaff(n);renderRecorder(n);
 const f=n[4],closed=f.slice(1).map((v,i)=>v===1?i+1:null).filter(Boolean);
 $('tip').innerHTML=`<strong>${n[0]} 운지 포인트</strong><br>${f[0]===.75?'엄지 구멍은 대부분 막고, 틈을 조금만 열어요.':f[0]?'왼손 엄지로 뒷면 구멍을 막아요.':'뒷면 엄지 구멍을 열어요.'}<br>앞면 ${closed.join('·')}번을 막아요.${selected===13?'<br>6번 겹구멍은 큰 구멍 하나만 막아요.':''}`;
}
function stop(){serial++;clearTimeout(playTimer);if(voice){try{voice.stop()}catch{}voice=null}$('play').classList.remove('playing');$('play').textContent='▷ 소리 듣기';}
async function play(){stop();const request=serial;try{ctx||=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();if(request!==serial)return;
 const t=ctx.currentTime,len=Number($('duration').value),freq=440*Math.pow(2,(notes[selected][2]-69)/12),osc=ctx.createOscillator(),gain=ctx.createGain();
 const re=new Float32Array(9),im=new Float32Array([0,1,.13,.20,.055,.045,.02,.01,.005]);osc.setPeriodicWave(ctx.createPeriodicWave(re,im));osc.frequency.value=freq;
 gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(Number($('volume').value)/100*.24,t+.06);gain.gain.setValueAtTime(Number($('volume').value)/100*.21,t+len-.12);gain.gain.linearRampToValueAtTime(0,t+len);
 osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+len+.02);voice=osc;$('play').classList.add('playing');$('play').textContent='■ 재생 멈추기';$('status').textContent=notes[selected][0]+' 소리 재생 중';playTimer=setTimeout(()=>{stop();$('status').textContent=''},len*1000+40);
 }catch(e){$('status').textContent='소리를 재생하지 못했습니다. 브라우저의 소리 설정을 확인해 주세요.'}}
function select(i,sound=true){selected=(i+notes.length)%notes.length;stop();$('status').textContent='';render();if(sound&&$('auto').checked)play();}
notes.forEach((n,i)=>{const b=document.createElement('button');b.className='note'+(i>11?' acc':'');b.innerHTML=`<span>${n[0]}</span><small>${n[1]}</small>`;b.onclick=()=>select(i);$('notes').append(b)});
$('play').onclick=()=>{if(voice){stop();$('status').textContent=''}else play()};
function setMode(v){handMode=v;$('hands').setAttribute('aria-pressed',v);$('holes').setAttribute('aria-pressed',!v);$('mirror').disabled=!v;renderRecorder(notes[selected]);}
$('holes').onclick=()=>setMode(false);$('hands').onclick=()=>setMode(true);$('mirror').onclick=()=>{mirrored=!mirrored;$('mirror').setAttribute('aria-pressed',mirrored);renderRecorder(notes[selected])};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('status').textContent='전체 화면은 브라우저의 F11 키를 이용해 주세요.'}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ 전체 화면 종료':'⛶ 전체 화면'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();select(selected+1)}if(e.key==='ArrowLeft'){e.preventDefault();select(selected-1)}if(e.code==='Space'){e.preventDefault();$('play').click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script>
</html>
